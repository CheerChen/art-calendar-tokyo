name: Scrape Single Source & Deploy

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to scrape'
        required: true
        type: choice
        options:
          - 東京藝術大学大学美術館
          - 多摩美術大学
          - 東京都現代美術館
          - 国立新美術館
          - 国立西洋美術館
          - 上野の森美術館
          - 東京都美術館
          - アーティゾン美術館
          - 森美術館
          - 21_21 DESIGN SIGHT
          - 東京国立近代美術館
          - 寺田倉庫
          - 横浜美術館
          - 東京オペラシティアートギャラリー
          - SOMPO美術館
          - TOKYO NODE
          - 千葉県立美術館
          - 千葉市美術館

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Restore scraper state from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e77f59c260bfe0ae47e1e998e989eea0
        run: |
          mkdir -p output
          npx --yes wrangler@4 r2 object get art-calendar-data/public/result.json --file result.json --remote || true
          npx --yes wrangler@4 r2 object get art-calendar-data/cache/cache.json --file output/cache.json --remote || true
          npx --yes wrangler@4 r2 object get art-calendar-data/cache/detail_cache.json --file output/detail_cache.json --remote || true

      - name: Run single scraper
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run --with-requirements requirements.txt scraper_single.py "${{ github.event.inputs.source }}"

      - name: Upload scraper state to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e77f59c260bfe0ae47e1e998e989eea0
        run: |
          npx --yes wrangler@4 r2 object put art-calendar-data/public/result.json --file result.json --content-type application/json --cache-control "public, max-age=300" --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/public/venues.json --file venues.json --content-type application/json --cache-control "public, max-age=300" --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/cache/cache.json --file output/cache.json --content-type application/json --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/cache/detail_cache.json --file output/detail_cache.json --content-type application/json --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/snapshots/result-${{ github.run_id }}-${{ github.event.inputs.source }}.json --file result.json --content-type application/json --force --remote
