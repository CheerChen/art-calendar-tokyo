<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Dark mode */

<script>
// Onboarding
(function() {
  if (localStorage.getItem('onboarding_done')) return;

  const steps = [
    {
      step: '',
      title: 'Tokyo Art Calendar \u3078\u3088\u3046\u3053\u305D\uFF01',
      desc: '\u6771\u4EAC\u306E\u7F8E\u8853\u9928\u30FB\u30AE\u30E3\u30E9\u30EA\u30FC\u306E\u5C55\u89A7\u4F1A\u60C5\u5831\u3092\u307E\u3068\u3081\u3066\u30C1\u30A7\u30C3\u30AF\u3067\u304D\u307E\u3059\u3002<br>\u304B\u3093\u305F\u3093\u306A\u4F7F\u3044\u65B9\u3092\u7D39\u4ECB\u3057\u307E\u3059\u306D\uFF01',
      video: null,
      dots: [true, false, false],
    },
    {
      step: 'STEP 1 / 2',
      title: 'Recently - \u6700\u65B0\u306E\u5C55\u89A7\u4F1A\u60C5\u5831',
      desc: '\u300CRecently\u300D\u30BF\u30D6\u3067\u306F\u3001\u958B\u50AC\u4E2D\u3084\u3053\u308C\u304B\u3089\u306E\u5C55\u89A7\u4F1A\u304C\u4E00\u89A7\u3067\u898B\u3089\u308C\u307E\u3059\u3002<br>\u30AB\u30FC\u30C9\u3092\u30BF\u30C3\u30D7\u3059\u308B\u3068\u3001\u5C55\u89A7\u4F1A\u306E\u8A73\u7D30\u30DA\u30FC\u30B8\u306B\u30B8\u30E3\u30F3\u30D7\u3067\u304D\u307E\u3059\u3088\uFF01',
      video: './step_1.webm',
      dots: [false, true, false],
    },
    {
      step: 'STEP 2 / 2',
      title: 'Timeline - \u30AC\u30F3\u30C8\u30C1\u30E3\u30FC\u30C8',
      desc: '\u6A2A\u306B\u30B9\u30AF\u30ED\u30FC\u30EB\u3057\u3066\u3001\u3082\u3046\u3059\u3050\u7D42\u308F\u308B\u5C55\u89A7\u4F1A\u3084\u3001\u3053\u308C\u304B\u3089\u59CB\u307E\u308B\u5C55\u89A7\u4F1A\u3092\u30C1\u30A7\u30C3\u30AF\uFF01<br>\u30D0\u30FC\u306B\u30DE\u30A6\u30B9\u3092\u4E57\u305B\u308B\u3068\u8A73\u7D30\u304C\u898B\u3089\u308C\u307E\u3059\u3002\u898B\u9003\u3057\u3092\u9632\u3052\u3061\u3083\u3044\u307E\u3059\u3088\uFF01',
      video: './step_2.webm',
      dots: [false, false, true],
    }
  ];

  let current = 0;
  const overlay = document.getElementById('onboarding');
  const card = document.getElementById('onboardingCard');

  function renderStep(i) {
    const s = steps[i];
    let html = `<div class="onb-step">${s.step}</div>`;
    html += `<div class="onb-title">${s.title}</div>`;
    html += `<div class="onb-desc">${s.desc}</div>`;
    if (s.video) {
      html += `<video class="onb-video" autoplay loop muted playsinline><source src="${s.video}" type="video/webm"></video>`;
    }
    html += `<div class="onb-dots">${s.dots.map(a => `<span class="onb-dot${a ? ' active' : ''}"></span>`).join('')}</div>`;
    if (i < steps.length - 1) {
      html += `<button class="onb-btn onb-btn-next" id="onbNext">\u6B21\u3078 \u2192</button>`;
    } else {
      html += `<button class="onb-btn onb-btn-next" id="onbClose">\u306F\u3058\u3081\u308B\uFF01</button>`;

    card.innerHTML = html;

    const next = document.getElementById('onbNext');
    if (next) next.addEventListener('click', () => { current++; renderStep(current); });
    const close = document.getElementById('onbClose');
    if (close) close.addEventListener('click', dismiss);
    document.getElementById('onbDismiss').addEventListener('click', dismiss);
  }

  function dismiss() {
    localStorage.setItem('onboarding_done', '1');
    overlay.classList.remove('show');
  }

  overlay.classList.add('show');
  renderStep(0);
})();
</script>

<script>
// Theme
function getTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) return saved;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}
applyTheme(getTheme());
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
  if (DATA) render(); // re-render for bg colors
});

let DATA = null;
let VENUES = {};
let allEvents = [];
let sourceColors = {};
let currentView = 'recently';

// Zoom levels: colW values
const ZOOM_LEVELS = [8, 12, 18, 27, 40];
let zoomIndex = 2; // default = 18px

// 14 distinct, accessible hues for sources
const SOURCE_PALETTE = [
  '#4a90d9', '#d94452', '#27ae60', '#8e44ad', '#e67e22',
  '#16a085', '#c0392b', '#2980b9', '#d4ac0d', '#7f8c8d',
  '#e84393', '#6c5ce7', '#00b894', '#2d3436', '#fd79a8',
  '#a29bfe',
];

function assignSourceColors() {
  sourceColors = {};
  DATA.sources.forEach((src, i) => {
    sourceColors[src.name] = SOURCE_PALETTE[i % SOURCE_PALETTE.length];
  });
}

function renderLegend() {
  const el = document.getElementById('legend');
  let html = '<button class="legend-toggle" id="legendToggle">Sources</button>';
  DATA.sources.forEach(src => {
    if (!src.events.length) return;
    const c = sourceColors[src.name];
    html += `<div class="legend-item"><span class="legend-swatch" style="background:${c}"></span>${src.name}</div>`;
  });
  html += `<span class="legend-rec"><span class="legend-rec-dot" style="border-color:#e74c3c"></span>Must See</span>`;
  html += `<span class="legend-rec"><span class="legend-rec-dot" style="border-color:#f39c12"></span>Recommended</span>`;
  el.innerHTML = html;
  document.getElementById('legendToggle').addEventListener('click', () => {
    el.classList.toggle('expanded');
  });
}

fetch('./result.json').then(r => { if (r.ok) return r.json(); throw 'not found'; })
  .then(d => {
    DATA = d;
    // Load venues.json in parallel; non-fatal if missing (map tab degrades).
    return fetch('./venues.json').then(r => r.ok ? r.json() : null).catch(() => null).then(v => { VENUES = v || {}; });
  })
  .then(() => init())
  .catch(() => { document.getElementById('meta').textContent = 'result.json not found'; });

// Tabs
function switchView(view, opts = {}) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  currentView = view;
  document.getElementById('timelinePanel').classList.toggle('active', currentView === 'timeline');
  document.getElementById('recentlyPanel').classList.toggle('active', currentView === 'recently');
  document.getElementById('mapPanel').classList.toggle('active', currentView === 'map');
  tooltip.style.display = 'none';
  tooltip.classList.remove('pinned');
  tooltipPinned = false;
  render();
  // Leaflet needs invalidateSize after the panel becomes visible.
  if (currentView === 'map' && mapInstance) setTimeout(() => mapInstance.invalidateSize(), 50);
  // Request geolocation only when entering Map tab (triggers browser prompt then).
  if (currentView === 'map' && opts.requestLocation !== false) requestUserLocation();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchView(tab.dataset.view));
});

function init() {
  allEvents = [];
  const sourceSelect = document.getElementById('filterSource');
  sourceSelect.innerHTML = '<option value="all">All Sources</option>';

  assignSourceColors();

  DATA.sources.forEach(src => {
    const opt = document.createElement('option');
    opt.value = src.name;
    opt.textContent = `${src.name} (${src.events.length})`;
    sourceSelect.appendChild(opt);
    src.events.forEach(ev => allEvents.push({ ...ev, _source: src.name }));
  });

  document.getElementById('meta').textContent = `${DATA.fetched_at.split('T')[0]} | ${DATA.sources.length} sources | ${allEvents.length} events`;
  renderLegend();

  document.getElementById('filterRec').onchange = render;
  document.getElementById('filterSource').onchange = render;
  render();
}

function getFiltered() {
  const recFilter = document.getElementById('filterRec').value;
  const srcFilter = document.getElementById('filterSource').value;
  return allEvents.filter(e => {
    if (recFilter === 'must_see' && e.recommendation !== 'must_see') return false;
    if (recFilter === 'recommended' && e.recommendation === 'normal') return false;
    if (srcFilter !== 'all' && e._source !== srcFilter) return false;
    return true;
  });
}

function render() {
  const events = getFiltered();
  if (currentView === 'timeline') {
    renderGantt(events);
  } else if (currentView === 'map') {
    renderMap(events);
  } else {
    renderRecently(events);
  }
}

// Tooltip
const tooltip = document.getElementById('tooltip');
let tooltipPinned = false;
function showTooltip(e, ev, pinned) {
  tooltipPinned = !!pinned;
  tooltip.classList.toggle('pinned', tooltipPinned);
  const rec = ev.recommendation || 'normal';
  const recLabels = { must_see: 'Must See', recommended: 'Recommended' };
  const coord = venueCoord(ev);
  let html = '';
  if (ev.image) html += `<img class="tt-image" src="${esc(ev.image)}" alt="" onerror="this.remove()">`;
  html += `<div class="tt-title">${esc(ev.title)}</div>`;
  html += `<div class="tt-venue">${esc(ev.venue || '')} - ${esc(ev._source)}</div>`;
  if (recLabels[rec]) html += `<span class="tt-badge ${rec}">${recLabels[rec]}</span>`;
  html += `<div class="tt-info">`;
  html += `<div>${ev.start_date || '?'} ~ ${ev.end_date || '?'}</div>`;
  if (ev.start_time) html += `<div>${ev.start_time}${ev.end_time ? ' - ' + ev.end_time : ''}</div>`;
  if (ev.admission) html += `<div>${esc(ev.admission)}</div>`;
  if (ev.closed_days) html += `<div>休館: ${esc(ev.closed_days)}</div>`;
  if (ev.reservation_required) html += `<div>要予約</div>`;
  html += `</div>`;
  if (ev.summary) html += `<div class="tt-summary">${esc(ev.summary)}</div>`;
  if (tooltipPinned) {
    const detailDisabled = ev.url ? '' : ' disabled';
    const navDisabled = coord ? '' : ' disabled';
    html += `<div class="tt-actions"><button class="tt-btn tt-btn-detail" type="button"${detailDisabled}>詳細</button><button class="tt-btn tt-btn-nav" type="button"${navDisabled}>ナビ</button></div>`;
  }
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  positionTooltip(e);
  if (tooltipPinned) bindTooltipActions(ev);
}
function bindTooltipActions(ev) {
  const detailBtn = tooltip.querySelector('.tt-btn-detail');
  const navBtn = tooltip.querySelector('.tt-btn-nav');
  if (detailBtn && ev.url) {
    detailBtn.addEventListener('click', e => {
      e.stopPropagation();
      window.open(ev.url, '_blank');
    });
  }
  if (navBtn) {
    navBtn.addEventListener('click', e => {
      e.stopPropagation();
      startNavigationForEvent(ev);
    });
  }
}
function positionTooltip(e) {
  tooltip.style.left = '0px';
  tooltip.style.top = '0px';
  const tt = tooltip.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + tt.width > vw) x = Math.max(4, vw - tt.width - 4);
  if (y + tt.height > vh) y = Math.max(4, e.clientY - tt.height - 14);
  if (x < 4) x = 4;
  if (y < 4) y = 4;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
document.addEventListener('mousemove', e => {
  if (tooltip.style.display === 'block' && !tooltipPinned) positionTooltip(e);
});
document.addEventListener('click', e => {
  if (!tooltipPinned) return;
  if (tooltip.contains(e.target) || e.target.closest('.gantt-bar')) return;
  tooltipPinned = false;
  tooltip.classList.remove('pinned');
  tooltip.style.display = 'none';
});

// ---- MONTHLY ----
function renderEventCard(ev) {
  const rec = ev.recommendation || 'normal';
  const srcColor = sourceColors[ev._source] || '#999';
  const recLabels = { must_see: 'Must See', recommended: 'Recommended' };
  const recTag = recLabels[rec] ? `<span class="card-rec ${rec}">${recLabels[rec]}</span>` : '';

  const sd = ev.start_date || '';
  const ed = ev.end_date || '';
  const dateStr = sd && ed ? `${sd.slice(5)} ~ ${ed.slice(5)}` : sd ? `${sd.slice(5)} ~` : '';

  let html = `<div class="event-card" style="border-left-color:${srcColor}" data-url="${esc(ev.url || '')}">`;
  html += `<div class="card-date">${dateStr}</div>`;
  html += `<div class="card-body">`;
  html += `<div class="card-title">${recTag} ${esc(ev.title)}</div>`;
  html += `<div class="card-venue">${esc(ev.venue || '')} - ${esc(ev._source)}</div>`;
  if (ev.summary) html += `<div class="card-summary">${esc(ev.summary)}</div>`;
  const metaParts = [];
  if (ev.start_time) metaParts.push(ev.start_time + (ev.end_time ? ' - ' + ev.end_time : ''));
  if (ev.admission) metaParts.push(ev.admission);
  if (ev.closed_days) metaParts.push('休館: ' + ev.closed_days);
  if (ev.reservation_required) metaParts.push('要予約');
  if (metaParts.length) html += `<div class="card-meta">${metaParts.map(m => `<span>${esc(m)}</span>`).join('')}</div>`;
  if (ev.image) html += `<img class="card-image" src="${esc(ev.image)}" alt="" loading="lazy" onerror="this.remove()">`;
  html += `</div></div>`;
  return html;
}

function renderRecently(events) {
  const container = document.getElementById('recentlyContainer');
  if (!events.length) { container.innerHTML = '<p style="padding:60px;color:#999;text-align:center">No events</p>'; return; }

  const today = localToday();
  const thisMonth = today.slice(0, 7);

  const recOrder = { must_see: 0, recommended: 1, normal: 2 };

  // Split: ongoing (started before today, end_date >= today) vs upcoming (start_date >= today)
  const ongoing = [];
  const upcoming = [];
  events.forEach(ev => {
    if (!ev.start_date) return;
    if (ev.start_date <= today && ev.end_date && ev.end_date >= today) {
      ongoing.push(ev);
    } else if (ev.start_date > today) {
      upcoming.push(ev);
    }
  });

  // Sort ongoing by end_date (ending soon first), then by recommendation
  ongoing.sort((a, b) => (a.end_date || '9999').localeCompare(b.end_date || '9999')
    || (recOrder[a.recommendation] ?? 2) - (recOrder[b.recommendation] ?? 2));

  // Sort upcoming by start_date
  upcoming.sort((a, b) => (a.start_date || '9999').localeCompare(b.start_date || '9999')
    || (recOrder[a.recommendation] ?? 2) - (recOrder[b.recommendation] ?? 2));

  let html = '';

  // Ongoing section
  if (ongoing.length) {
    html += `<div class="month-group">`;
    html += `<div class="month-title">開催中 (${ongoing.length})</div>`;
    ongoing.forEach(ev => { html += renderEventCard(ev); });
    html += `</div>`;
  }

  // Upcoming grouped by month
  const months = {};
  upcoming.forEach(ev => {
    const key = ev.start_date.slice(0, 7);
    if (!months[key]) months[key] = [];
    months[key].push(ev);
  });

  Object.keys(months).sort().forEach(key => {
    const [yr, mo] = key.split('-');
    html += `<div class="month-group">`;
    html += `<div class="month-title">${yr}年${parseInt(mo)}月 (${months[key].length})</div>`;
    months[key].forEach(ev => { html += renderEventCard(ev); });
    html += `</div>`;
  });

  container.innerHTML = html;

  container.scrollTop = 0;

  // Click to open URL
  container.querySelectorAll('.event-card').forEach(card => {
    card.addEventListener('click', () => {
      const url = card.dataset.url;
      if (url) window.open(url, '_blank');
    });
  });
}

// ---- MAP ----
// Venue normalization: strip room/exhibition-room suffixes so multiple events
// at the same physical venue resolve to one canonical name in venues.json.
// Must stay in sync with build_venues.py.
const VENUE_ROOM_SUFFIXES = [
  /\s+企画展示室.*$/,
  /\s+コレクション展示室.*$/,
  /\s+本館.*$/,
  /\s+新館.*$/,
  /\s+ギャラリー\s*\d.*$/,
  /\s+ギャラリー\s*[1-9].*$/,
  /\s+4Fコリドール$/,
  /\s+本部棟.*$/,
  /\s+じゆうエリア$/,
  /\s+建築倉庫$/,
];
const VENUE_OVERRIDES = {
  'TOKYO NODE GALLERY A/B/C': 'TOKYO NODE',
  'TOKYO NODE GALLERY A/B/C・TOKYO NODE LAB': 'TOKYO NODE',
  'TOKYO NODE HALL': 'TOKYO NODE',
};
function normalizeVenue(raw) {
  const s = (raw || '').trim();
  if (VENUE_OVERRIDES[s]) return VENUE_OVERRIDES[s];
  for (const pat of VENUE_ROOM_SUFFIXES) {
    const n = s.replace(pat, '');
    if (n !== s) return n.trim();
  }
  return s;
}
function venueCoord(ev) {
  const canon = normalizeVenue(ev.venue);
  const entry = VENUES[canon];
  if (entry && entry.lat != null && entry.lng != null) return { canonical: canon, lat: entry.lat, lng: entry.lng, entry };
  return null;
}

let mapInstance = null;
let mapTileLayer = null;
let mapCluster = null;
let mapFirstRender = true;

function buildMapPopupHTML(ev) {
  const rec = ev.recommendation || 'normal';
  const recLabels = { must_see: 'Must See', recommended: 'Recommended' };
  const coord = venueCoord(ev);
  const navData = coord ? `data-nav-lat="${coord.lat}" data-nav-lng="${coord.lng}" data-nav-venue="${esc(ev.venue || '')}"` : '';
  let h = '';
  if (ev.image) h += `<img class="mp-image" src="${esc(ev.image)}" alt="" onerror="this.remove()">`;
  h += `<div class="mp-title">${esc(ev.title)}</div>`;
  h += `<div class="mp-venue">${esc(ev.venue || '')} - ${esc(ev._source)}</div>`;
  if (recLabels[rec]) h += `<span class="mp-badge ${rec}">${recLabels[rec]}</span>`;
  h += `<div class="mp-info">`;
  h += `<div>${ev.start_date || '?'} ~ ${ev.end_date || '?'}</div>`;
  if (ev.start_time) h += `<div>${ev.start_time}${ev.end_time ? ' - ' + ev.end_time : ''}</div>`;
  if (ev.admission) h += `<div>${esc(ev.admission)}</div>`;
  if (ev.closed_days) h += `<div>休館: ${esc(ev.closed_days)}</div>`;
  if (ev.reservation_required) h += `<div>要予約</div>`;
  h += `</div>`;
  if (ev.summary) h += `<div class="mp-summary">${esc(ev.summary)}</div>`;
  if (ev.url) h += `<a class="mp-link" href="${esc(ev.url)}" target="_blank">詳細を見る →</a>`;
  if (coord) h += `<button class="mp-nav-btn" ${navData}>現在地からナビゲーション</button>`;
  return h;
}

function renderMap(events) {
  const container = document.getElementById('mapContainer');
  const notice = document.getElementById('mapNoLocNotice');

  if (!events.length) {
    notice.style.display = 'none';
    if (mapInstance) mapCluster.clearLayers();
    return;
  }

  // Lazy-init map on first render.
  if (!mapInstance) {
    mapInstance = L.map(container, { zoomControl: true, scrollWheelZoom: true, maxZoom: 18, minZoom: 6 }).setView([35.68, 139.76], 11);
    mapCluster = L.markerClusterGroup({ spiderfyOnMaxZoom: true, showCoverageOnHover: false, maxClusterRadius: 50 });
    mapInstance.addLayer(mapCluster);
    bindPopupNav();
  }

  // (Re)apply tile layer matching current theme.
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const tileUrl = isDark
    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    : 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';
  const tileAttr = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';
  if (mapTileLayer) mapInstance.removeLayer(mapTileLayer);
  mapTileLayer = L.tileLayer(tileUrl, { attribution: tileAttr, maxZoom: 19 }).addTo(mapInstance);

  // Build markers: one per event. Same-venue events stack and cluster/spiderfy.
  mapCluster.clearLayers();
  const located = [];
  const noLoc = [];
  events.forEach(ev => {
    const c = venueCoord(ev);
    if (!c) { noLoc.push(ev); return; }
    located.push(Object.assign({ ev }, c));
  });

  located.forEach(({ ev, lat, lng }) => {
    const rec = ev.recommendation || 'normal';
    const color = rec === 'must_see' ? '#ea4335' : rec === 'recommended' ? '#f39c12' : '#3a8ee6';
    const icon = L.divIcon({
      className: 'map-pin',
      html: `<svg width="28" height="40" viewBox="0 0 28 40"><path d="M14 0C6.27 0 0 6.27 0 14c0 9.5 14 26 14 26s14-16.5 14-26C28 6.27 21.73 0 14 0z" fill="${color}" stroke="#fff" stroke-width="1.5"/><circle cx="14" cy="14" r="4.5" fill="#fff"/></svg>`,
      iconSize: [28, 40],
      iconAnchor: [14, 40],
      popupAnchor: [0, -38],
    });
    const m = L.marker([lat, lng], { icon });
    m.bindPopup(buildMapPopupHTML(ev), { maxWidth: 320 });
    mapCluster.addLayer(m);
  });

  // First render: fixed Tokyo default. fitBounds is avoided because outliers
  // (八王子/横浜) distort the view; user can pan/zoom to see all markers.
  if (mapFirstRender && located.length) {
    mapFirstRender = false;
  }

  // Fail loud: surface events that have no coordinates.
  if (noLoc.length) {
    notice.textContent = `${noLoc.length} events without location (not shown on map)`;
    notice.style.display = 'block';
  } else {
    notice.style.display = 'none';
  }

  setTimeout(() => mapInstance.invalidateSize(), 50);
}

// ---- USER LOCATION ----
let userLocationMarker = null;
let userLocationRequested = false;

function requestUserLocation(manual, onSuccess) {
  if (!('geolocation' in navigator) || !mapInstance) return;
  // Auto-prompt (tab click): only once per page load.
  // Manual (locate button): always re-request, even if done before.
  if (!manual && userLocationRequested) return;
  userLocationRequested = true;
  const btn = document.getElementById('mapLocateBtn');
  if (manual && btn) btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(
    pos => {
      if (manual && btn) btn.classList.remove('locating');
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      // Guard against (0,0) "Null Island" fallback: some browsers return
      // success with null-island coords when no real fix is available, which
      // would pan the map into the Pacific. Reject only that case.
      if (!isFinite(lat) || !isFinite(lng) || (lat === 0 && lng === 0)) return;
      // Remove previous marker if re-locating.
      if (userLocationMarker) { mapInstance.removeLayer(userLocationMarker); userLocationMarker = null; }
      const icon = L.divIcon({
        className: 'map-user-pin',
        html: '<div class="map-user-dot"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
      userLocationMarker = L.marker([lat, lng], { icon, zIndexOffset: 1000 }).addTo(mapInstance);
      userLocationMarker.bindPopup('あなたの現在地', { closeButton: false });
      // Only auto-pan when the user is actually in Japan — otherwise keep the
      // Tokyo view (all events are in Tokyo; panning to a far location would
      // hide them). The blue dot is still added at the real location.
      const inJapan = lat >= 24 && lat <= 46 && lng >= 122 && lng <= 147;
      if (inJapan) mapInstance.panTo([lat, lng], { animate: true });
      if (onSuccess) onSuccess(userLocationMarker.getLatLng());
    },
    err => {
      if (manual && btn) btn.classList.remove('locating');
      // Denied / unavailable / timeout — fail silent, no marker. User still sees events.
      // Common on first visit (user dismisses prompt); nothing to surface here.
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

document.getElementById('mapLocateBtn').addEventListener('click', () => requestUserLocation(true));

// ---- NAVIGATION (transit guidance API + map route view) ----
// /guidance/plan returns each option with .journey (sidebar text) and .map.segments[].polyline
// (real walking paths from OSM + real transit polylines following stop order). No more
// geocoding station names by hand.
const TRANSIT_GUIDANCE_URL = 'https://api.transit.ls8h.com/api/v1/guidance/plan';

let navState = null; // { options, selected, fromLL, toLL, toVenue }
let navRouteLayers = []; // polylines + markers on map

function fmtDuration(secs) {
  const m = Math.round(secs / 60);
  if (m < 60) return m + '分';
  return Math.floor(m / 60) + '時間' + (m % 60) + '分';
}

function fmtTime(secs) {
  const h = Math.floor(secs / 3600) % 24;
  const m = Math.floor(secs / 60) % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

// Walks shorter than this are in-station transfers — noise in the sidebar.
const WALK_HIDE_THRESHOLD_SECS = 120;
// Drop "all-walking" fallback journeys longer than this. The API returns a
// raw walk option even for 40+ km routes (船橋→上野毛 = 9h on foot); nobody
// is going to walk that.
const ALL_WALK_MAX_SECS = 60 * 60;
// When OSM walking routing fails, the API can fall back to a two-point
// straight line. Keep short links, but reject long direct "walks" as invalid.
const DIRECT_WALK_FALLBACK_MAX_KM = 1.5;

function distanceKm(a, b) {
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 6371 * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
}

function isLongDirectWalkSegment(seg) {
  if (seg.kind !== 'walk') return false;
  const pts = (seg.polyline || []).filter(p => p && p.lat != null && p.lon != null);
  if (pts.length !== 2) return false;
  return distanceKm(pts[0], pts[1]) > DIRECT_WALK_FALLBACK_MAX_KM;
}

function hasUnroutableWalkFallback(opt) {
  return (opt.map?.segments || []).some(isLongDirectWalkSegment);
}

// Pick a readable text color (near-black or white) for a brand bg color.
// Uses WCAG sRGB relative luminance — Tokyo transit colors span from
// bright yellow (#FFD400) to deep magenta (#B6007A), and a fixed
// white-on-color baseline fails WCAG AA for ~70% of them. We pick whichever
// of black/white gives the higher contrast ratio.
function chipTextColor(hex) {
  if (!hex) return '#fff';
  const m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return '#fff';
  const n = parseInt(m[1], 16);
  const lin = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => {
    const s = c / 255;
    return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
  });
  const L = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
  // Black-vs-white crossover at L ≈ 0.179. Above → dark text, below → white.
  return L > 0.179 ? '#1a1a1a' : '#fff';
}

// Inline SVG icons (stroke uses currentColor so they follow chipTextColor's
// black/white pick automatically). Tiny line-art, matched to the header icon
// style elsewhere in this file.
const SVG_ICON_ATTR = 'viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
const SVG_ICONS = {
  rail:  `<svg ${SVG_ICON_ATTR}><rect x="5" y="3" width="14" height="14" rx="2"/><path d="M5 11h14"/><path d="M8 20l-2 2M16 20l2 2"/><circle cx="9" cy="15" r="0.6" fill="currentColor" stroke="none"/><circle cx="15" cy="15" r="0.6" fill="currentColor" stroke="none"/></svg>`,
  bus:   `<svg ${SVG_ICON_ATTR}><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M4 10h16"/><circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/></svg>`,
  ferry: `<svg ${SVG_ICON_ATTR}><path d="M3 19c1.5.7 2.5 1 4 1s2.5-1 4-1 2.5 1 4 1 2.5-.3 4-1"/><path d="M5 16l2-7h10l2 7"/><path d="M12 9V4"/></svg>`,
  walk:  `<svg ${SVG_ICON_ATTR}><circle cx="13" cy="4" r="2"/><path d="M8 21l3-7 3 3v4"/><path d="M11 14l-2-3 3-3 3 2 2 1"/></svg>`,
};

function modeIconSVG(mode) {
  if (mode === 'bus') return SVG_ICONS.bus;
  if (mode === 'ferry') return SVG_ICONS.ferry;
  if (mode === 'walk') return SVG_ICONS.walk;
  // rail / subway / metro / tram and any unknown rail-shaped mode.
  return SVG_ICONS.rail;
}

function legChipHTML(leg) {
  const color = leg.color ? '#' + leg.color : '#666';
  const text = chipTextColor(color);
  const name = esc(leg.routeName || leg.mode || '乗車');
  return `<span class="nav-leg-chip" style="background:${color};color:${text}">${modeIconSVG(leg.mode)}${name}</span>`;
}

function summarizeLegsHTML(legs) {
  const transit = legs.filter(l => l.kind === 'transit');
  if (!transit.length) return `<span class="nav-leg-chip" style="background:#888;color:#fff">${SVG_ICONS.walk}徒歩</span>`;
  return transit.map(legChipHTML).join('<span class="nav-chip-sep">→</span>');
}

function enterNavMode(toLat, toLng, toVenue) {
  if (!userLocationMarker) {
    // Trigger location request first; user can retry after blue dot appears.
    requestUserLocation(true);
    alert('現在地を取得してからもう一度「ナビゲーション」を押してください');
    return;
  }
  const fromLL = userLocationMarker.getLatLng();
  navState = { options: [], selected: 0, fromLL, toLL: { lat: toLat, lng: toLng }, toVenue };

  document.getElementById('mapPanel').classList.add('nav-active');
  document.getElementById('navFromInput').value = '現在地';
  document.getElementById('navToInput').value = toVenue;
  document.getElementById('navRouteList').innerHTML = '<div class="nav-loading">経路を検索中…</div>';
  document.getElementById('navRouteDetail').innerHTML = '';
  if (mapInstance) mapInstance.closePopup();
  setTimeout(() => mapInstance.invalidateSize(), 50);

  const from = `geo:${fromLL.lat},${fromLL.lng}`;
  const to = `geo:${toLat},${toLng}`;
  const params = new URLSearchParams({ from, to, fromLabel: '現在地', toLabel: toVenue, numItineraries: '3' });
  fetch(`${TRANSIT_GUIDANCE_URL}?${params}`)
    .then(r => r.ok ? r.json() : Promise.reject(new Error('API error ' + r.status)))
    .then(data => {
      const rawOpts = data.options || [];
      let opts = rawOpts;
      // Drop unreasonable "walk-the-entire-route" fallbacks. The API will
      // happily return a 9-hour walk option for 40+ km routes.
      opts = opts.filter(o => {
        const legs = o.journey?.legs || [];
        const allWalk = legs.length > 0 && legs.every(l => l.kind === 'walk');
        return !(allWalk && (o.journey?.durationSecs ?? 0) > ALL_WALK_MAX_SECS);
      });
      // Also drop partial routes where the final/initial walk is just a long
      // two-point straight line. Example: 船橋→上野毛 currently comes back as
      // train to 代々木 plus a 9.7km direct "walk" polyline to the campus.
      opts = opts.filter(o => !hasUnroutableWalkFallback(o));
      // Sort by total duration ascending so [0] is the fastest option,
      // then default-select it.
      opts.sort((a, b) => (a.journey?.durationSecs ?? Infinity) - (b.journey?.durationSecs ?? Infinity));
      navState.options = opts;
      if (!navState.options.length) {
        const msg = rawOpts.length
          ? 'この目的地への正確な経路を乗換APIから取得できませんでした'
          : '経路が見つかりませんでした';
        document.getElementById('navRouteList').innerHTML = '<div class="nav-error">' + esc(msg) + '</div>';
        return;
      }
      renderRouteList();
      selectRoute(0);
    })
    .catch(err => {
      document.getElementById('navRouteList').innerHTML = '<div class="nav-error">経路検索に失敗: ' + esc(err.message || '') + '</div>';
    });
}

function renderRouteList() {
  const list = document.getElementById('navRouteList');
  list.innerHTML = '';
  navState.options.forEach((opt, i) => {
    const j = opt.journey;
    const fare = j.fare ? j.fare.ticket : null;
    const fareStr = fare != null ? fare + '円' : '';
    const depTime = fmtTime(j.departureSecs);
    const arrTime = fmtTime(j.arrivalSecs);
    const item = document.createElement('div');
    item.className = 'nav-route-item' + (i === navState.selected ? ' selected' : '');
    item.innerHTML = `<div class="nav-route-item-header"><span class="nav-route-item-dur">${fmtDuration(j.durationSecs)}</span><span class="nav-route-item-meta">${depTime}→${arrTime} · 乗換${j.transferCount}回${fareStr ? ' · ' + fareStr : ''}</span></div><div class="nav-route-item-summary">${summarizeLegsHTML(j.legs)}</div>`;
    item.addEventListener('click', () => selectRoute(i));
    list.appendChild(item);
  });
}

function selectRoute(index) {
  navState.selected = index;
  renderRouteList();
  renderRouteDetail(index);
  drawRouteOnMap(index);
}

function renderRouteDetail(index) {
  const route = navState.options[index].journey;
  const detail = document.getElementById('navRouteDetail');
  let html = '<div class="nav-route-detail-title">詳細</div><div class="nav-detail-timeline">';
  route.legs.forEach(leg => {
    const legDurSecs = leg.arrivalSecs - leg.departureSecs;
    // Hide trivial in-station transfer walks (under WALK_HIDE_THRESHOLD_SECS).
    if (leg.kind === 'walk' && legDurSecs < WALK_HIDE_THRESHOLD_SECS) return;
    const fromName = esc(leg.from.name || '');
    const toName = esc(leg.to.name || '');
    const depTime = fmtTime(leg.departureSecs);
    const arrTime = fmtTime(leg.arrivalSecs);
    const dur = fmtDuration(legDurSecs);
    const platform = leg.from.platformCode ? `<span class="nav-detail-leg-platform">[${esc(leg.from.platformCode)}番]</span> ` : '';
    if (leg.kind === 'walk') {
      html += `<div class="nav-detail-leg walk"><div class="nav-detail-leg-time">${depTime} → ${arrTime}</div><div class="nav-detail-leg-station">${fromName}</div><div class="nav-detail-leg-walk">${SVG_ICONS.walk}徒歩 ${dur}</div><div class="nav-detail-leg-station">${toName}</div></div>`;
    } else {
      const color = leg.color ? '#' + leg.color : '#2f6bff';
      const text = chipTextColor(color);
      const routeName = esc(leg.routeName || leg.mode || '乗車');
      const headsign = leg.headsign ? `<div class="nav-detail-leg-headsign"><span class="nav-headsign-label">行先</span>${esc(leg.headsign)}方面</div>` : '';
      html += `<div class="nav-detail-leg transit" style="--leg-color:${color}"><div class="nav-detail-leg-time">${depTime} → ${arrTime}</div><div class="nav-detail-leg-station">${platform}${fromName}</div><div class="nav-detail-leg-route" style="--leg-color:${color};color:${text}">${modeIconSVG(leg.mode)}${routeName}</div>${headsign}<div class="nav-detail-leg-walk">${dur}</div><div class="nav-detail-leg-station">${toName}</div></div>`;
    }
  });
  html += '</div>';
  detail.innerHTML = html;
}

function drawRouteOnMap(index) {
  clearRouteLayers();
  if (!mapInstance || !navState) return;
  const opt = navState.options[index];
  const map = opt && opt.map;
  if (!map) return;

  // Index points by id so segment endpoints can pick up their role/name for markers.
  const pointById = {};
  (map.points || []).forEach(p => { pointById[p.id] = p; });

  // Draw segments using the real polylines the API returns
  // (osmWalk for walks, stopOrder along the line for transit).
  (map.segments || []).forEach(seg => {
    const coords = (seg.polyline || []).map(p => [p.lat, p.lon]).filter(c => c[0] != null && c[1] != null);
    if (coords.length < 2) return;
    if (seg.kind === 'walk') {
      const line = L.polyline(coords, { color: '#666', weight: 4, opacity: 0.75, dashArray: '6,8', lineCap: 'round', lineJoin: 'round' });
      line.addTo(mapInstance);
      navRouteLayers.push(line);
    } else {
      const color = seg.color ? '#' + seg.color : '#2f6bff';
      // White casing for contrast, then colored line on top.
      const casing = L.polyline(coords, { color: '#fff', weight: 8, opacity: 0.9, lineCap: 'round', lineJoin: 'round' });
      casing.addTo(mapInstance);
      navRouteLayers.push(casing);
      const line = L.polyline(coords, { color, weight: 5, opacity: 0.95, lineCap: 'round', lineJoin: 'round' });
      line.addTo(mapInstance);
      navRouteLayers.push(line);
    }
  });

  // Place markers per point role. Origin uses the existing blue dot, so skip it here.
  (map.points || []).forEach(p => {
    if (p.role === 'origin') return;
    const ll = L.latLng(p.lat, p.lon);
    if (p.role === 'destination') {
      const dest = L.marker(ll, {
        icon: L.divIcon({
          className: 'map-pin',
          html: '<div style="width:18px;height:18px;border-radius:50%;background:#e74c3c;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>',
          iconSize: [18, 18],
          iconAnchor: [9, 9],
        }),
        interactive: false,
        zIndexOffset: 1000,
      });
      dest.addTo(mapInstance);
      navRouteLayers.push(dest);
    } else {
      // stop / transfer — small white dot, tooltip with station name.
      const dot = L.circleMarker(ll, { radius: 5, color: '#1a1a1a', weight: 2, fillColor: '#fff', fillOpacity: 1 });
      if (p.name) dot.bindTooltip(p.name, { direction: 'top', offset: [0, -4] });
      dot.addTo(mapInstance);
      navRouteLayers.push(dot);
    }
  });

  // Fit to the bounds the API provides; pad enough that the floating sidebar
  // (340px wide top-left card) doesn't cover the start of the route.
  const b = map.bounds;
  if (b && b.minLat != null) {
    const bounds = L.latLngBounds([[b.minLat, b.minLon], [b.maxLat, b.maxLon]]);
    mapInstance.fitBounds(bounds, { paddingTopLeft: [360, 32], paddingBottomRight: [32, 32], animate: true });
  }
}

function clearRouteLayers() {
  navRouteLayers.forEach(l => mapInstance.removeLayer(l));
  navRouteLayers = [];
}

function exitNavMode() {
  clearRouteLayers();
  navState = null;
  document.getElementById('mapPanel').classList.remove('nav-active');
  document.getElementById('navRouteList').innerHTML = '';
  document.getElementById('navRouteDetail').innerHTML = '';
  setTimeout(() => mapInstance.invalidateSize(), 50);
}

document.getElementById('navExitBtn').addEventListener('click', exitNavMode);

// Bind nav button clicks when popups open (content is dynamic).
function bindPopupNav() {
  if (!mapInstance) return;
  mapInstance.on('popupopen', e => {
    const btn = e.popup.getElement().querySelector('.mp-nav-btn');
    if (btn) btn.addEventListener('click', () => {
      const toLat = parseFloat(btn.dataset.navLat);
      const toLng = parseFloat(btn.dataset.navLng);
      const toVenue = btn.dataset.navVenue || '目的地';
      enterNavMode(toLat, toLng, toVenue);
    });
  });
}

function startNavigationForEvent(ev) {
  const coord = venueCoord(ev);
  if (!coord) return;
  switchView('map', { requestLocation: false });
  setTimeout(() => {
    if (userLocationMarker) {
      enterNavMode(coord.lat, coord.lng, ev.venue || coord.canonical || '目的地');
      return;
    }
    requestUserLocation(true, () => {
      enterNavMode(coord.lat, coord.lng, ev.venue || coord.canonical || '目的地');
    });
  }, 80);
}

// ---- GANTT ----
function renderGantt(events) {
  const container = document.getElementById('ganttContainer');
  if (!events.length) { container.innerHTML = '<p style="padding:60px;color:#999;text-align:center">No events</p>'; return; }

  const today = localToday();

  // Start from today, extend to cover all events' end dates
  let minDate = today;
  let maxDate = today;
  events.forEach(e => {
    // Include events that started before today but haven't ended
    if (e.end_date && e.end_date > today && e.start_date && e.start_date < minDate) minDate = e.start_date;
    if (e.end_date && e.end_date > maxDate) maxDate = e.end_date;
  });

  // Extend to full months
  minDate = minDate.slice(0, 7) + '-01';
  const maxD = new Date(maxDate);
  maxD.setMonth(maxD.getMonth() + 1, 0);
  maxDate = maxD.toISOString().slice(0, 10);

  const days = [];
  let d = new Date(minDate);
  const endD = new Date(maxDate);
  while (d <= endD) {
    days.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }

  // Sort by date
  const recOrder = { must_see: 0, recommended: 1, normal: 2 };
  events.sort((a, b) => (a.start_date || '9999').localeCompare(b.start_date || '9999')
    || (recOrder[a.recommendation] ?? 2) - (recOrder[b.recommendation] ?? 2));

  const colW = ZOOM_LEVELS[zoomIndex];
  const rowH = 32; // px per event row
  const headerH = 60; // month + day header height
  const totalW = days.length * colW;
  const totalH = headerH + events.length * rowH;

  // Build weekend column background as CSS gradient stops
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const weekdayBg = isDark ? '#1e1e1e' : '#fff';
  const weekendBg = isDark ? '#232018' : '#faf8f5';
  const stops = [];
  days.forEach((day, idx) => {
    const dt = new Date(day);
    const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
    const color = isWeekend ? weekendBg : weekdayBg;
    const x0 = ((idx / days.length) * 100).toFixed(4);
    const x1 = (((idx + 1) / days.length) * 100).toFixed(4);
    stops.push(`${color} ${x0}%, ${color} ${x1}%`);
  });
  const colBg = `linear-gradient(to right, ${stops.join(', ')})`;

  let html = `<div class="gantt" style="width:${totalW}px; position:relative;">`;

  // Header row (month + day) using grid
  html += `<div style="display:grid; grid-template-columns:repeat(${days.length}, ${colW}px); position:sticky; top:0; z-index:11;">`;

  // Month header
  let i = 0;
  while (i < days.length) {
    const month = days[i].slice(0, 7);
    let span = 0;
    while (i + span < days.length && days[i + span].slice(0, 7) === month) span++;
    const mNum = parseInt(month.slice(5));
    const yr = month.slice(0, 4);
    html += `<div class="gantt-month-cell" style="grid-column: ${i + 1} / span ${span};">${yr}/${mNum}月</div>`;
    i += span;
  }

  // Day header
  days.forEach((day, idx) => {
    const dt = new Date(day);
    const dow = dt.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isToday = day === today;
    const cls = [isWeekend ? 'weekend' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');
    html += `<div class="gantt-day-cell ${cls}" style="grid-column: ${idx + 1};">${dt.getDate()}</div>`;
  });
  html += `</div>`;

  // Rows area with column stripe background
  html += `<div class="gantt-rows" style="background:${colBg}; min-height:${events.length * rowH}px;">`;

  // Event bars
  events.forEach((ev, evIdx) => {
    const rec = ev.recommendation || 'normal';
    const srcColor = sourceColors[ev._source] || '#999';

    if (ev.start_date && ev.end_date) {
      let startIdx = days.indexOf(ev.start_date);
      let endIdx = days.indexOf(ev.end_date);
      if (startIdx < 0 && ev.start_date < days[0]) startIdx = 0;
      if (endIdx < 0 && ev.end_date > days[days.length - 1]) endIdx = days.length - 1;
      if (startIdx >= 0 && endIdx >= 0 && endIdx >= startIdx) {
        const left = startIdx * colW;
        const width = (endIdx - startIdx + 1) * colW;
        const top = evIdx * rowH + 3;
        const recLabels = { must_see: 'Must See', recommended: 'Recommended' };
        const recIcon = recLabels[rec] ? `<span class="bar-rec-badge ${rec}">${recLabels[rec]}</span>` : '';
        const srcTag = `<span class="bar-rec">${esc(ev._source)}</span>`;
        html += `<div class="gantt-bar ${rec}" data-idx="${evIdx}" style="position:absolute; left:${left}px; top:${top}px; width:${width}px; background:${srcColor};">${recIcon}${srcTag}<span class="bar-label">${esc(ev.title)}</span></div>`;
      }
    }
  });

  // Today line
  const todayIdx = days.indexOf(today);
  if (todayIdx >= 0) {
    const left = todayIdx * colW + Math.floor(colW / 2);
    html += `<div class="gantt-today-line" style="left:${left}px; top:0; height:100%;"></div>`;
  }

  html += `</div></div>`;
  container.innerHTML = html;

  // Scroll to today
  if (todayIdx >= 0) {
    container.scrollLeft = Math.max(0, todayIdx * colW - container.clientWidth / 3);
  }

  // Events — desktop: hover preview, click pins actions; mobile: tap pins the
  // same action tooltip. Actions are always explicit buttons.
  const isMobile = 'ontouchstart' in window;
  container.querySelectorAll('.gantt-bar').forEach(bar => {
    const idx = parseInt(bar.dataset.idx);
    if (isMobile) {
      bar.addEventListener('click', e => {
        e.stopPropagation();
        showTooltip(e, events[idx], true);
      });
    } else {
      bar.addEventListener('mouseenter', e => {
        if (!tooltipPinned) showTooltip(e, events[idx]);
      });
      bar.addEventListener('mouseleave', () => {
        if (!tooltipPinned) tooltip.style.display = 'none';
      });
      bar.addEventListener('click', e => {
        e.stopPropagation();
        showTooltip(e, events[idx], true);
      });
    }
  });
}


function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Zoom
function updateZoomButtons() {
  document.getElementById('zoomIn').disabled = zoomIndex >= ZOOM_LEVELS.length - 1;
  document.getElementById('zoomOut').disabled = zoomIndex <= 0;
}
function handleZoom(delta) {
  const container = document.getElementById('ganttContainer');
  const oldColW = ZOOM_LEVELS[zoomIndex];
  const centerX = container.scrollLeft + container.clientWidth / 2;
  const centerDay = centerX / oldColW;

  zoomIndex = Math.max(0, Math.min(ZOOM_LEVELS.length - 1, zoomIndex + delta));
  updateZoomButtons();
  render();

  const newColW = ZOOM_LEVELS[zoomIndex];
  container.scrollLeft = centerDay * newColW - container.clientWidth / 2;
}
document.getElementById('zoomIn').addEventListener('click', () => handleZoom(1));
document.getElementById('zoomOut').addEventListener('click', () => handleZoom(-1));
updateZoomButtons();

// Share
document.getElementById('shareBtn').addEventListener('click', async () => {
  const btn = document.getElementById('shareBtn');
  const shareData = {
    title: 'Tokyo Art Calendar',
    text: '\u6771\u4EAC\u306E\u5C55\u89A7\u4F1A\u30B9\u30B1\u30B8\u30E5\u30FC\u30EB\u3092\u4E00\u89A7\u3067\u78BA\u8A8D',
    url: location.href,
  };
  btn.classList.add('shared');
  setTimeout(() => btn.classList.remove('shared'), 400);
  if (navigator.share) {
    try { await navigator.share(shareData); } catch {}
  } else {
    await navigator.clipboard.writeText(location.href);
    const toast = document.getElementById('shareToast');
    toast.textContent = 'URL\u3092\u30B3\u30D4\u30FC\u3057\u307E\u3057\u305F';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }
});
