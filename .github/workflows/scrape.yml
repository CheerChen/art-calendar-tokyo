name: Scrape & Deploy

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Run scraper
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: uv run --with-requirements requirements.txt scraper.py

      - name: Commit caches and result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/cache.json output/detail_cache.json result.json
          git diff --cached --quiet || git commit -m "update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Prepare deploy
        run: |
          mkdir -p dist
          cp viewer.html dist/index.html
          cp result.json dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=art-calendar-tokyo
