name: Scrape & Deploy

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Run scraper
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # Swap the model / endpoint from repo Variables & Secrets, no code change.
          # Unset values arrive as "" and fall back to defaults in extract.py.
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run --with-requirements requirements.txt scraper.py

      - name: Commit caches and result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/cache.json output/detail_cache.json result.json
          git diff --cached --quiet || git commit -m "update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Prepare deploy
        run: |
          mkdir -p dist
          cp viewer.html dist/index.html
          cp result.json dist/
          cp -f *.webm dist/ 2>/dev/null || true
          cp -f ogp.png dist/ 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e77f59c260bfe0ae47e1e998e989eea0
          command: pages deploy dist --project-name=art-calendar-tokyo
