<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-71Q7HGYEJG"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-71Q7HGYEJG');</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231a1a1a'/><text x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='%23fff'>A</text></svg>">
<title>Tokyo Art Calendar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Hiragino Sans', sans-serif; background: #f5f5f0; color: #333; line-height: 1.6; }

  .header { background: #1a1a1a; color: #fff; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  .header-left {}
  .header h1 { font-size: 18px; font-weight: 500; letter-spacing: 0.05em; }
  .header .meta { font-size: 13px; color: #999; margin-top: 2px; }
  .theme-toggle { background: none; border: none; cursor: pointer; width: 28px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center; transition: transform 0.4s ease; }
  .theme-toggle svg { width: 22px; height: 22px; }
  [data-theme="dark"] .theme-toggle { transform: rotate(180deg); }

  .tabs { display: flex; background: #fff; border-bottom: 2px solid #e0e0e0; padding: 0 32px; }
  .tab { padding: 10px 20px; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; color: #888; }
  .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 600; }

  .controls { padding: 12px 32px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; gap: 12px; align-items: center; font-size: 13px; flex-wrap: wrap; }
  .controls select { font-size: 13px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }
  .controls .count { margin-left: auto; color: #999; }

  /* Legend */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 10px 32px; background: #fff; border-bottom: 1px solid #eee; font-size: 12px; color: #666; overflow: hidden; }
  .legend-toggle { display: none; background: none; border: 1px solid #ccc; border-radius: 3px; font-size: 11px; color: #888; cursor: pointer; padding: 2px 8px; flex-shrink: 0; }
  .legend-toggle::after { content: ' \25BE'; }
  .legend.expanded .legend-toggle::after { content: ' \25B4'; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .legend-rec { display: inline-flex; align-items: center; gap: 4px; margin-left: 16px; padding-left: 16px; border-left: 1px solid #ddd; }
  .legend-rec-dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }

  /* Gantt timeline */
  .gantt-container { overflow-x: auto; overflow-y: auto; max-height: calc(100vh - 260px); }
  .gantt { display: grid; min-width: 100%; position: relative; }

  .gantt-month-cell { background: #eee; text-align: center; font-size: 13px; font-weight: 600; padding: 6px 0; border-right: 1px solid #ddd; border-bottom: 1px solid #ccc; position: sticky; top: 0; z-index: 11; }
  .gantt-day-cell { background: #f9f9f9; text-align: center; font-size: 11px; padding: 3px 0; border-right: 1px solid #eee; border-bottom: 1px solid #ddd; position: sticky; top: 30px; z-index: 11; color: #666; }
  .gantt-day-cell.weekend { background: #f0ede8; color: #c0392b; }
  .gantt-day-cell.today { background: #2c3e50; color: #fff; font-weight: 700; }

  .gantt-label { display: none; }

  .gantt-rows { position: relative; }

  .gantt-bar { height: 26px; border-radius: 3px; cursor: pointer; opacity: 0.9; display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap; }
  .gantt-bar:hover { opacity: 1; box-shadow: 0 2px 8px rgba(0,0,0,0.25); z-index: 6; }
  .bar-rec-badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; margin-right: 4px; flex-shrink: 0; pointer-events: none; font-weight: 600; }
  .bar-rec-badge.must_see { background: #e74c3c; color: #fff; }
  .bar-rec-badge.recommended { background: #f39c12; color: #fff; }
  .gantt-bar .bar-label { font-size: 11px; color: #fff; text-overflow: ellipsis; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,0.3); pointer-events: none; }
  .gantt-bar .bar-rec { font-size: 9px; background: rgba(0,0,0,0.25); color: #fff; padding: 1px 4px; border-radius: 3px; margin-right: 4px; flex-shrink: 0; pointer-events: none; }

  /* Today line */
  .gantt-today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: #e74c3c; z-index: 8; pointer-events: none; }

  /* Tooltip */
  .tooltip { display: none; position: fixed; background: #1a1a1a; color: #fff; padding: 14px 18px; border-radius: 8px; font-size: 13px; line-height: 1.7; max-width: 400px; z-index: 1000; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .tooltip .tt-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .tooltip .tt-venue { color: #aaa; font-size: 12px; }
  .tooltip .tt-badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 8px; margin-top: 4px; }
  .tooltip .tt-badge.must_see { background: #e74c3c; color: #fff; }
  .tooltip .tt-badge.recommended { background: #f39c12; color: #fff; }
  .tooltip .tt-image { width: 100%; max-height: 180px; object-fit: cover; border-radius: 4px; margin-bottom: 8px; }
  .tooltip .tt-info { margin-top: 8px; color: #ccc; font-size: 12px; }
  .tooltip .tt-info div { margin: 2px 0; }
  .tooltip .tt-summary { margin-top: 8px; color: #ddd; font-size: 12px; border-top: 1px solid #333; padding-top: 8px; }

  /* Monthly view */
  .monthly-container { padding: 24px 32px; overflow-y: auto; max-height: calc(100vh - 260px); }
  .month-group { margin-bottom: 32px; }
  .month-title { font-size: 16px; font-weight: 600; color: #1a1a1a; padding-bottom: 8px; border-bottom: 2px solid #1a1a1a; margin-bottom: 12px; }
  .event-card { display: flex; gap: 14px; padding: 12px 14px; background: #fff; border-radius: 6px; margin-bottom: 8px; border-left: 4px solid #999; cursor: pointer; transition: box-shadow 0.15s; }
  .event-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .event-card .card-date { flex-shrink: 0; width: 90px; font-size: 12px; color: #666; line-height: 1.8; }
  .event-card .card-image { max-width: 100%; max-height: 200px; border-radius: 4px; object-fit: contain; margin-top: 8px; }
  .event-card .card-body { flex: 1; min-width: 0; }
  .event-card .card-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .event-card .card-venue { font-size: 12px; color: #888; }
  .event-card .card-summary { font-size: 12px; color: #666; margin-top: 4px; }
  .event-card .card-meta { font-size: 11px; color: #999; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .event-card .card-rec { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; flex-shrink: 0; }
  .card-rec.must_see { background: #e74c3c; color: #fff; }
  .card-rec.recommended { background: #f39c12; color: #fff; }

  .view-panel { display: none; }
  .view-panel.active { display: block; }

  /* Mobile */
  @media (max-width: 768px) {
    .header { padding: 12px 16px; }
    .header h1 { font-size: 16px; }
    .tabs { padding: 0 16px; }
    .tab { padding: 8px 14px; font-size: 13px; }
    .controls { padding: 10px 16px; gap: 8px; }
    .controls label { display: none; }
    .controls select { font-size: 12px; padding: 5px 6px; }
    .legend { padding: 8px 16px; gap: 10px; font-size: 11px; }
    .legend .legend-item, .legend .legend-rec { display: none; }
    .legend.expanded .legend-item, .legend.expanded .legend-rec { display: flex; }
    .legend-toggle { display: inline-flex; }
    .legend-rec { margin-left: 8px; padding-left: 8px; }
    .gantt-container { max-height: calc(100vh - 280px); -webkit-overflow-scrolling: touch; }
    .gantt-month-cell { font-size: 11px; padding: 4px 0; }
    .gantt-day-cell { font-size: 9px; padding: 2px 0; }
    .gantt-bar { height: 22px; margin: 2px 0; }
    .gantt-bar .bar-label { font-size: 10px; }
    .gantt-bar .bar-rec { font-size: 8px; }
    .tooltip { max-width: 280px; font-size: 12px; }
    .tooltip .tt-title { font-size: 14px; }
    .monthly-container { padding: 16px; max-height: calc(100vh - 280px); }
    .month-title { font-size: 15px; }
    .event-card { flex-direction: column; gap: 4px; padding: 10px 12px; }
    .event-card .card-date { width: auto; font-size: 11px; line-height: 1.4; }
    .event-card .card-title { font-size: 13px; }
  }

  /* Dark mode */
  [data-theme="dark"] body { background: #1a1a1a; color: #e0e0e0; }
  [data-theme="dark"] .header { background: #111; }
  [data-theme="dark"] .tabs { background: #222; border-bottom-color: #333; }
  [data-theme="dark"] .tab { color: #888; }
  [data-theme="dark"] .tab.active { color: #fff; border-bottom-color: #fff; }
  [data-theme="dark"] .controls { background: #222; border-bottom-color: #333; }
  [data-theme="dark"] .controls select { background: #333; color: #e0e0e0; border-color: #555; }
  [data-theme="dark"] .legend { background: #222; border-bottom-color: #333; color: #999; }
  [data-theme="dark"] .legend-rec { border-left-color: #444; }

  [data-theme="dark"] .gantt-month-cell { background: #2a2a2a; color: #ccc; border-right-color: #444; border-bottom-color: #444; }
  [data-theme="dark"] .gantt-day-cell { background: #222; color: #999; border-right-color: #333; border-bottom-color: #444; }
  [data-theme="dark"] .gantt-day-cell.weekend { background: #2a2520; color: #c0392b; }
  [data-theme="dark"] .gantt-day-cell.today { background: #e74c3c; color: #fff; }

  [data-theme="dark"] .month-title { color: #e0e0e0; border-bottom-color: #e0e0e0; }
  [data-theme="dark"] .event-card { background: #252525; }
  [data-theme="dark"] .event-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  [data-theme="dark"] .event-card .card-date { color: #aaa; }
  [data-theme="dark"] .event-card .card-venue { color: #888; }
  [data-theme="dark"] .event-card .card-summary { color: #999; }
  [data-theme="dark"] .event-card .card-image { background: #333; }
  [data-theme="dark"] .event-card .card-meta { color: #777; }

  /* Onboarding */
  .onboarding-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
  .onboarding-overlay.show { display: flex; }
  .onboarding-card { background: #fff; border-radius: 16px; max-width: 400px; width: 90%; padding: 28px 24px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.25); animation: onb-pop 0.3s ease; }
  @keyframes onb-pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .onboarding-card .onb-step { font-size: 11px; color: #aaa; letter-spacing: 0.1em; margin-bottom: 8px; }
  .onboarding-card .onb-title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .onboarding-card .onb-desc { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 16px; }
  .onboarding-card .onb-video { width: 100%; border-radius: 10px; margin-bottom: 16px; background: #f5f5f0; }
  .onboarding-card .onb-btn { display: inline-block; padding: 10px 28px; border-radius: 24px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .onboarding-card .onb-btn-next { background: #1a1a1a; color: #fff; }
  .onboarding-card .onb-btn-next:hover { background: #333; }
  .onboarding-card .onb-btn-done { background: none; color: #999; font-size: 12px; margin-top: 8px; padding: 6px 16px; }
  .onboarding-card .onb-btn-done:hover { color: #333; }
  .onboarding-card .onb-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
  .onboarding-card .onb-dot { width: 6px; height: 6px; border-radius: 50%; background: #ddd; }
  .onboarding-card .onb-dot.active { background: #1a1a1a; }
  [data-theme="dark"] .onboarding-card { background: #252525; color: #e0e0e0; }
  [data-theme="dark"] .onboarding-card .onb-desc { color: #aaa; }
  [data-theme="dark"] .onboarding-card .onb-video { background: #333; }
  [data-theme="dark"] .onboarding-card .onb-btn-next { background: #fff; color: #1a1a1a; }
  [data-theme="dark"] .onboarding-card .onb-btn-next:hover { background: #ddd; }
  [data-theme="dark"] .onboarding-card .onb-btn-done:hover { color: #ccc; }
  [data-theme="dark"] .onboarding-card .onb-dot.active { background: #fff; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Tokyo Art Calendar</h1>
    <div class="meta" id="meta">Loading...</div>
  </div>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff"/><path d="M12 2 A10 10 0 0 1 12 22 Z" fill="#1a1a1a"/></svg></button>
</div>

<div class="tabs">
  <div class="tab active" data-view="recently">Recently</div>
  <div class="tab" data-view="timeline">Timeline</div>
</div>

<div class="controls">
  <label>Filter:</label>
  <select id="filterRec">
    <option value="all">All</option>
    <option value="recommended">Recommended+</option>
    <option value="must_see">Must See</option>
  </select>
  <select id="filterSource">
    <option value="all">All Sources</option>
  </select>
  <div class="count" id="count"></div>
</div>

<div class="legend" id="legend"></div>

<div class="view-panel" id="timelinePanel" style="padding: 24px 32px;">
  <div class="gantt-container" id="ganttContainer"></div>
</div>

<div class="view-panel active" id="recentlyPanel">
  <div class="monthly-container" id="recentlyContainer"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="onboarding-overlay" id="onboarding">
  <div class="onboarding-card" id="onboardingCard"></div>
</div>

<script>
// Onboarding
(function() {
  if (localStorage.getItem('onboarding_done')) return;

  const steps = [
    {
      step: 'STEP 1 / 2',
      title: 'Recently - \u6700\u65B0\u306E\u5C55\u89A7\u4F1A\u60C5\u5831',
      desc: '\u300CRecently\u300D\u30BF\u30D6\u3067\u306F\u3001\u958B\u50AC\u4E2D\u3084\u3053\u308C\u304B\u3089\u306E\u5C55\u89A7\u4F1A\u304C\u4E00\u89A7\u3067\u898B\u3089\u308C\u307E\u3059\u3002<br>\u30AB\u30FC\u30C9\u3092\u30BF\u30C3\u30D7\u3059\u308B\u3068\u3001\u5C55\u89A7\u4F1A\u306E\u8A73\u7D30\u30DA\u30FC\u30B8\u306B\u30B8\u30E3\u30F3\u30D7\u3067\u304D\u307E\u3059\u3088\uFF01',
      video: './step_1.webm',
      dots: [true, false],
    },
    {
      step: 'STEP 2 / 2',
      title: 'Timeline - \u30AC\u30F3\u30C8\u30C1\u30E3\u30FC\u30C8',
      desc: '\u6A2A\u306B\u30B9\u30AF\u30ED\u30FC\u30EB\u3057\u3066\u3001\u3082\u3046\u3059\u3050\u7D42\u308F\u308B\u5C55\u89A7\u4F1A\u3084\u3001\u3053\u308C\u304B\u3089\u59CB\u307E\u308B\u5C55\u89A7\u4F1A\u3092\u30C1\u30A7\u30C3\u30AF\uFF01<br>\u30D0\u30FC\u306B\u30DE\u30A6\u30B9\u3092\u4E57\u305B\u308B\u3068\u8A73\u7D30\u304C\u898B\u3089\u308C\u307E\u3059\u3002\u898B\u9003\u3057\u3092\u9632\u3052\u3061\u3083\u3044\u307E\u3059\u3088\uFF01',
      video: './step_2.webm',
      dots: [false, true],
    }
  ];

  let current = 0;
  const overlay = document.getElementById('onboarding');
  const card = document.getElementById('onboardingCard');

  function renderStep(i) {
    const s = steps[i];
    let html = `<div class="onb-step">${s.step}</div>`;
    html += `<div class="onb-title">${s.title}</div>`;
    html += `<div class="onb-desc">${s.desc}</div>`;
    if (s.video) {
      html += `<video class="onb-video" autoplay loop muted playsinline><source src="${s.video}" type="video/webm"></video>`;
    }
    html += `<div class="onb-dots">${s.dots.map(a => `<span class="onb-dot${a ? ' active' : ''}"></span>`).join('')}</div>`;
    if (i < steps.length - 1) {
      html += `<button class="onb-btn onb-btn-next" id="onbNext">\u6B21\u3078 \u2192</button>`;
    } else {
      html += `<button class="onb-btn onb-btn-next" id="onbClose">\u306F\u3058\u3081\u308B\uFF01</button>`;
    }
    html += `<br><button class="onb-btn onb-btn-done" id="onbDismiss">\u3082\u3046\u8868\u793A\u3057\u306A\u3044</button>`;
    card.innerHTML = html;

    const next = document.getElementById('onbNext');
    if (next) next.addEventListener('click', () => { current++; renderStep(current); });
    const close = document.getElementById('onbClose');
    if (close) close.addEventListener('click', dismiss);
    document.getElementById('onbDismiss').addEventListener('click', dismiss);
  }

  function dismiss() {
    localStorage.setItem('onboarding_done', '1');
    overlay.classList.remove('show');
  }

  overlay.classList.add('show');
  renderStep(0);
})();
</script>

<script>
// Theme
function getTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) return saved;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
}
applyTheme(getTheme());
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
  if (DATA) render(); // re-render for bg colors
});

let DATA = null;
let allEvents = [];
let sourceColors = {};
let currentView = 'recently';

// 14 distinct, accessible hues for sources
const SOURCE_PALETTE = [
  '#4a90d9', '#d94452', '#27ae60', '#8e44ad', '#e67e22',
  '#16a085', '#c0392b', '#2980b9', '#d4ac0d', '#7f8c8d',
  '#e84393', '#6c5ce7', '#00b894', '#2d3436', '#fd79a8',
  '#a29bfe',
];

function assignSourceColors() {
  sourceColors = {};
  DATA.sources.forEach((src, i) => {
    sourceColors[src.name] = SOURCE_PALETTE[i % SOURCE_PALETTE.length];
  });
}

function renderLegend() {
  const el = document.getElementById('legend');
  let html = '<button class="legend-toggle" id="legendToggle">Sources</button>';
  DATA.sources.forEach(src => {
    if (!src.events.length) return;
    const c = sourceColors[src.name];
    html += `<div class="legend-item"><span class="legend-swatch" style="background:${c}"></span>${src.name}</div>`;
  });
  html += `<span class="legend-rec"><span class="legend-rec-dot" style="border-color:#e74c3c"></span>Must See</span>`;
  html += `<span class="legend-rec"><span class="legend-rec-dot" style="border-color:#f39c12"></span>Recommended</span>`;
  el.innerHTML = html;
  document.getElementById('legendToggle').addEventListener('click', () => {
    el.classList.toggle('expanded');
  });
}

fetch('./result.json').then(r => { if (r.ok) return r.json(); throw 'not found'; })
  .then(d => { DATA = d; init(); })
  .catch(() => { document.getElementById('meta').textContent = 'result.json not found'; });

// Tabs
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('timelinePanel').classList.toggle('active', currentView === 'timeline');
    document.getElementById('recentlyPanel').classList.toggle('active', currentView === 'recently');
    tooltip.style.display = 'none';
    render();
  });
});

function init() {
  allEvents = [];
  const sourceSelect = document.getElementById('filterSource');
  sourceSelect.innerHTML = '<option value="all">All Sources</option>';

  assignSourceColors();

  DATA.sources.forEach(src => {
    const opt = document.createElement('option');
    opt.value = src.name;
    opt.textContent = `${src.name} (${src.events.length})`;
    sourceSelect.appendChild(opt);
    src.events.forEach(ev => allEvents.push({ ...ev, _source: src.name }));
  });

  document.getElementById('meta').textContent = `${DATA.fetched_at.split('T')[0]} | ${DATA.sources.length} sources | ${allEvents.length} events`;
  renderLegend();

  document.getElementById('filterRec').onchange = render;
  document.getElementById('filterSource').onchange = render;
  render();
}

function getFiltered() {
  const recFilter = document.getElementById('filterRec').value;
  const srcFilter = document.getElementById('filterSource').value;
  return allEvents.filter(e => {
    if (recFilter === 'must_see' && e.recommendation !== 'must_see') return false;
    if (recFilter === 'recommended' && e.recommendation === 'normal') return false;
    if (srcFilter !== 'all' && e._source !== srcFilter) return false;
    return true;
  });
}

function render() {
  const events = getFiltered();
  document.getElementById('count').textContent = `${events.length} events`;
  if (currentView === 'timeline') {
    renderGantt(events);
  } else {
    renderRecently(events);
  }
}

// Tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(e, ev) {
  const rec = ev.recommendation || 'normal';
  const recLabels = { must_see: 'Must See', recommended: 'Recommended' };
  let html = '';
  if (ev.image) html += `<img class="tt-image" src="${esc(ev.image)}" alt="" onerror="this.remove()">`;
  html += `<div class="tt-title">${esc(ev.title)}</div>`;
  html += `<div class="tt-venue">${esc(ev.venue || '')} - ${esc(ev._source)}</div>`;
  if (recLabels[rec]) html += `<span class="tt-badge ${rec}">${recLabels[rec]}</span>`;
  html += `<div class="tt-info">`;
  html += `<div>${ev.start_date || '?'} ~ ${ev.end_date || '?'}</div>`;
  if (ev.start_time) html += `<div>${ev.start_time}${ev.end_time ? ' - ' + ev.end_time : ''}</div>`;
  if (ev.admission) html += `<div>${esc(ev.admission)}</div>`;
  if (ev.closed_days) html += `<div>休館: ${esc(ev.closed_days)}</div>`;
  if (ev.reservation_required) html += `<div>要予約</div>`;
  html += `</div>`;
  if (ev.summary) html += `<div class="tt-summary">${esc(ev.summary)}</div>`;
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  positionTooltip(e);
}
function positionTooltip(e) {
  tooltip.style.left = '0px';
  tooltip.style.top = '0px';
  const tt = tooltip.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + tt.width > vw) x = Math.max(4, vw - tt.width - 4);
  if (y + tt.height > vh) y = Math.max(4, e.clientY - tt.height - 14);
  if (x < 4) x = 4;
  if (y < 4) y = 4;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
document.addEventListener('mousemove', e => { if (tooltip.style.display === 'block') positionTooltip(e); });

// ---- MONTHLY ----
function renderEventCard(ev) {
  const rec = ev.recommendation || 'normal';
  const srcColor = sourceColors[ev._source] || '#999';
  const recLabels = { must_see: 'Must See', recommended: 'Recommended' };
  const recTag = recLabels[rec] ? `<span class="card-rec ${rec}">${recLabels[rec]}</span>` : '';

  const sd = ev.start_date || '';
  const ed = ev.end_date || '';
  const dateStr = sd && ed ? `${sd.slice(5)} ~ ${ed.slice(5)}` : sd ? `${sd.slice(5)} ~` : '';

  let html = `<div class="event-card" style="border-left-color:${srcColor}" data-url="${esc(ev.url || '')}">`;
  html += `<div class="card-date">${dateStr}</div>`;
  html += `<div class="card-body">`;
  html += `<div class="card-title">${recTag} ${esc(ev.title)}</div>`;
  html += `<div class="card-venue">${esc(ev.venue || '')} - ${esc(ev._source)}</div>`;
  if (ev.summary) html += `<div class="card-summary">${esc(ev.summary)}</div>`;
  const metaParts = [];
  if (ev.start_time) metaParts.push(ev.start_time + (ev.end_time ? ' - ' + ev.end_time : ''));
  if (ev.admission) metaParts.push(ev.admission);
  if (ev.closed_days) metaParts.push('休館: ' + ev.closed_days);
  if (ev.reservation_required) metaParts.push('要予約');
  if (metaParts.length) html += `<div class="card-meta">${metaParts.map(m => `<span>${esc(m)}</span>`).join('')}</div>`;
  if (ev.image) html += `<img class="card-image" src="${esc(ev.image)}" alt="" loading="lazy" onerror="this.remove()">`;
  html += `</div></div>`;
  return html;
}

function renderRecently(events) {
  const container = document.getElementById('recentlyContainer');
  if (!events.length) { container.innerHTML = '<p style="padding:60px;color:#999;text-align:center">No events</p>'; return; }

  const today = localToday();
  const thisMonth = today.slice(0, 7);

  const recOrder = { must_see: 0, recommended: 1, normal: 2 };

  // Split: ongoing (started before today, end_date >= today) vs upcoming (start_date >= today)
  const ongoing = [];
  const upcoming = [];
  events.forEach(ev => {
    if (!ev.start_date) return;
    if (ev.start_date <= today && ev.end_date && ev.end_date >= today) {
      ongoing.push(ev);
    } else if (ev.start_date > today) {
      upcoming.push(ev);
    }
  });

  // Sort ongoing by end_date (ending soon first), then by recommendation
  ongoing.sort((a, b) => (a.end_date || '9999').localeCompare(b.end_date || '9999')
    || (recOrder[a.recommendation] ?? 2) - (recOrder[b.recommendation] ?? 2));

  // Sort upcoming by start_date
  upcoming.sort((a, b) => (a.start_date || '9999').localeCompare(b.start_date || '9999')
    || (recOrder[a.recommendation] ?? 2) - (recOrder[b.recommendation] ?? 2));

  let html = '';

  // Ongoing section
  if (ongoing.length) {
    html += `<div class="month-group">`;
    html += `<div class="month-title">開催中 (${ongoing.length})</div>`;
    ongoing.forEach(ev => { html += renderEventCard(ev); });
    html += `</div>`;
  }

  // Upcoming grouped by month
  const months = {};
  upcoming.forEach(ev => {
    const key = ev.start_date.slice(0, 7);
    if (!months[key]) months[key] = [];
    months[key].push(ev);
  });

  Object.keys(months).sort().forEach(key => {
    const [yr, mo] = key.split('-');
    html += `<div class="month-group">`;
    html += `<div class="month-title">${yr}年${parseInt(mo)}月 (${months[key].length})</div>`;
    months[key].forEach(ev => { html += renderEventCard(ev); });
    html += `</div>`;
  });

  container.innerHTML = html;

  container.scrollTop = 0;

  // Click to open URL
  container.querySelectorAll('.event-card').forEach(card => {
    card.addEventListener('click', () => {
      const url = card.dataset.url;
      if (url) window.open(url, '_blank');
    });
  });
}

// ---- GANTT ----
function renderGantt(events) {
  const container = document.getElementById('ganttContainer');
  if (!events.length) { container.innerHTML = '<p style="padding:60px;color:#999;text-align:center">No events</p>'; return; }

  const today = localToday();

  // Start from today, extend to cover all events' end dates
  let minDate = today;
  let maxDate = today;
  events.forEach(e => {
    // Include events that started before today but haven't ended
    if (e.end_date && e.end_date > today && e.start_date && e.start_date < minDate) minDate = e.start_date;
    if (e.end_date && e.end_date > maxDate) maxDate = e.end_date;
  });

  // Extend to full months
  minDate = minDate.slice(0, 7) + '-01';
  const maxD = new Date(maxDate);
  maxD.setMonth(maxD.getMonth() + 1, 0);
  maxDate = maxD.toISOString().slice(0, 10);

  const days = [];
  let d = new Date(minDate);
  const endD = new Date(maxDate);
  while (d <= endD) {
    days.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }

  // Sort by date
  const recOrder = { must_see: 0, recommended: 1, normal: 2 };
  events.sort((a, b) => (a.start_date || '9999').localeCompare(b.start_date || '9999')
    || (recOrder[a.recommendation] ?? 2) - (recOrder[b.recommendation] ?? 2));

  const colW = 18; // px per day column
  const rowH = 32; // px per event row
  const headerH = 60; // month + day header height
  const totalW = days.length * colW;
  const totalH = headerH + events.length * rowH;

  // Build weekend column background as CSS gradient stops
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const weekdayBg = isDark ? '#1e1e1e' : '#fff';
  const weekendBg = isDark ? '#232018' : '#faf8f5';
  const stops = [];
  days.forEach((day, idx) => {
    const dt = new Date(day);
    const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
    const color = isWeekend ? weekendBg : weekdayBg;
    const x0 = ((idx / days.length) * 100).toFixed(4);
    const x1 = (((idx + 1) / days.length) * 100).toFixed(4);
    stops.push(`${color} ${x0}%, ${color} ${x1}%`);
  });
  const colBg = `linear-gradient(to right, ${stops.join(', ')})`;

  let html = `<div class="gantt" style="width:${totalW}px; position:relative;">`;

  // Header row (month + day) using grid
  html += `<div style="display:grid; grid-template-columns:repeat(${days.length}, ${colW}px); position:sticky; top:0; z-index:11;">`;

  // Month header
  let i = 0;
  while (i < days.length) {
    const month = days[i].slice(0, 7);
    let span = 0;
    while (i + span < days.length && days[i + span].slice(0, 7) === month) span++;
    const mNum = parseInt(month.slice(5));
    const yr = month.slice(0, 4);
    html += `<div class="gantt-month-cell" style="grid-column: ${i + 1} / span ${span};">${yr}/${mNum}月</div>`;
    i += span;
  }

  // Day header
  days.forEach((day, idx) => {
    const dt = new Date(day);
    const dow = dt.getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isToday = day === today;
    const cls = [isWeekend ? 'weekend' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');
    html += `<div class="gantt-day-cell ${cls}" style="grid-column: ${idx + 1};">${dt.getDate()}</div>`;
  });
  html += `</div>`;

  // Rows area with column stripe background
  html += `<div class="gantt-rows" style="background:${colBg}; min-height:${events.length * rowH}px;">`;

  // Event bars
  events.forEach((ev, evIdx) => {
    const rec = ev.recommendation || 'normal';
    const srcColor = sourceColors[ev._source] || '#999';

    if (ev.start_date && ev.end_date) {
      let startIdx = days.indexOf(ev.start_date);
      let endIdx = days.indexOf(ev.end_date);
      if (startIdx < 0 && ev.start_date < days[0]) startIdx = 0;
      if (endIdx < 0 && ev.end_date > days[days.length - 1]) endIdx = days.length - 1;
      if (startIdx >= 0 && endIdx >= 0 && endIdx >= startIdx) {
        const left = startIdx * colW;
        const width = (endIdx - startIdx + 1) * colW;
        const top = evIdx * rowH + 3;
        const recLabels = { must_see: 'Must See', recommended: 'Recommended' };
        const recIcon = recLabels[rec] ? `<span class="bar-rec-badge ${rec}">${recLabels[rec]}</span>` : '';
        const srcTag = `<span class="bar-rec">${esc(ev._source)}</span>`;
        html += `<div class="gantt-bar ${rec}" data-idx="${evIdx}" style="position:absolute; left:${left}px; top:${top}px; width:${width}px; background:${srcColor};">${recIcon}${srcTag}<span class="bar-label">${esc(ev.title)}</span></div>`;
      }
    }
  });

  // Today line
  const todayIdx = days.indexOf(today);
  if (todayIdx >= 0) {
    const left = todayIdx * colW + Math.floor(colW / 2);
    html += `<div class="gantt-today-line" style="left:${left}px; top:0; height:100%;"></div>`;
  }

  html += `</div></div>`;
  container.innerHTML = html;

  // Scroll to today
  if (todayIdx >= 0) {
    container.scrollLeft = Math.max(0, todayIdx * colW - container.clientWidth / 3);
  }

  // Events — desktop: hover tooltip + click opens URL; mobile: tap shows tooltip, second tap opens URL
  const isMobile = 'ontouchstart' in window;
  let activeBarIdx = -1;
  container.querySelectorAll('.gantt-bar').forEach(bar => {
    const idx = parseInt(bar.dataset.idx);
    if (isMobile) {
      bar.addEventListener('click', e => {
        e.stopPropagation();
        if (activeBarIdx === idx) {
          if (events[idx].url) window.open(events[idx].url, '_blank');
        } else {
          activeBarIdx = idx;
          showTooltip(e, events[idx]);
        }
      });
    } else {
      bar.addEventListener('mouseenter', e => showTooltip(e, events[idx]));
      bar.addEventListener('mouseleave', () => tooltip.style.display = 'none');
      bar.addEventListener('click', () => { if (events[idx].url) window.open(events[idx].url, '_blank'); });
    }
  });
  if (isMobile) {
    document.addEventListener('click', () => { tooltip.style.display = 'none'; activeBarIdx = -1; });
  }
}


function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
