name: Scrape & Deploy

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Ensure 90-day snapshot retention
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e77f59c260bfe0ae47e1e998e989eea0
        run: |
          rules="$(npx --yes wrangler@4 r2 bucket lifecycle list art-calendar-data)"
          if grep -Fq "expire-result-snapshots-90d" <<<"$rules"; then
            echo "Snapshot lifecycle rule already exists"
          else
            npx --yes wrangler@4 r2 bucket lifecycle add \
              art-calendar-data \
              expire-result-snapshots-90d \
              snapshots/ \
              --expire-days 90 \
              --force
          fi

      - name: Restore scraper state from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e77f59c260bfe0ae47e1e998e989eea0
        run: |
          mkdir -p output
          npx --yes wrangler@4 r2 object get art-calendar-data/cache/cache.json --file output/cache.json --remote || true
          npx --yes wrangler@4 r2 object get art-calendar-data/cache/detail_cache.json --file output/detail_cache.json --remote || true

      - name: Run scraper
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          # Swap the model / endpoint from repo Variables & Secrets, no code change.
          # Unset values arrive as "" and fall back to defaults in extract.py.
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: uv run --with-requirements requirements.txt scraper.py

      - name: Upload scraper state to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e77f59c260bfe0ae47e1e998e989eea0
        run: |
          npx --yes wrangler@4 r2 object put art-calendar-data/public/result.json --file result.json --content-type application/json --cache-control "public, max-age=300" --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/public/venues.json --file venues.json --content-type application/json --cache-control "public, max-age=300" --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/cache/cache.json --file output/cache.json --content-type application/json --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/cache/detail_cache.json --file output/detail_cache.json --content-type application/json --force --remote
          npx --yes wrangler@4 r2 object put art-calendar-data/snapshots/result-${{ github.run_id }}.json --file result.json --content-type application/json --force --remote
